<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 680" width="1040" height="680" font-family="Charter, 'Bitstream Charter', 'Iowan Old Style', Georgia, serif"><rect width="1040" height="680" fill="#ffffff"/><text x="40.0" y="40.0" font-size="17" fill="#1d2633" text-anchor="start" font-weight="bold">Can quoting resume after a crash at midnight Eastern? It depends on what the broker can still show.</text><text x="40.0" y="61.0" font-size="11.5" fill="#5f6b7a" text-anchor="start" font-weight="normal">A simulated broker, three simulated histories, real weather inputs. Decisions read from each world&#x27;s journal at 00:10 ET; A&#x27;s holds if the executions reply is one contiguous window.</text><text x="40.0" y="98.0" font-size="11.5" fill="#5f6b7a" text-anchor="start" font-weight="normal">World</text><text x="104.0" y="98.0" font-size="11.5" fill="#5f6b7a" text-anchor="start" font-weight="normal">What the executions reply showed</text><text x="340.0" y="98.0" font-size="11.5" fill="#5f6b7a" text-anchor="start" font-weight="normal">Miami</text><text x="440.0" y="98.0" font-size="11.5" fill="#5f6b7a" text-anchor="start" font-weight="normal">Los Angeles</text><text x="560.0" y="98.0" font-size="11.5" fill="#5f6b7a" text-anchor="start" font-weight="normal">Why</text><line x1="40.0" y1="108.0" x2="1000.0" y2="108.0" stroke="#d9dde3" stroke-width="1"/><text x="40.0" y="124.0" font-size="12.5" fill="#1d2633" text-anchor="start" font-weight="bold">A</text><text x="104.0" y="124.0" font-size="11.5" fill="#1d2633" text-anchor="start" font-weight="normal">executions back to 23:45 ET</text><text x="340.0" y="124.0" font-size="12" fill="#1d2633" text-anchor="start" font-weight="normal">closed</text><text x="440.0" y="124.0" font-size="12.5" fill="#0b6584" text-anchor="start" font-weight="bold">resume</text><text x="560.0" y="124.0" font-size="11.5" fill="#1d2633" text-anchor="start" font-weight="normal">all orders accounted for; the lost one matched on orderId, orderRef, permId</text><line x1="40.0" y1="132.0" x2="1000.0" y2="132.0" stroke="#d9dde3" stroke-width="1"/><text x="40.0" y="148.0" font-size="12.5" fill="#1d2633" text-anchor="start" font-weight="bold">B1</text><text x="104.0" y="148.0" font-size="11.5" fill="#1d2633" text-anchor="start" font-weight="normal">none of the fills the journal saw</text><text x="340.0" y="148.0" font-size="12" fill="#1d2633" text-anchor="start" font-weight="normal">closed</text><text x="440.0" y="148.0" font-size="12.5" fill="#9a6200" text-anchor="start" font-weight="bold">suspend</text><text x="560.0" y="148.0" font-size="11.5" fill="#1d2633" text-anchor="start" font-weight="normal">i-105 not found; position -4 unattributed</text><line x1="40.0" y1="156.0" x2="1000.0" y2="156.0" stroke="#d9dde3" stroke-width="1"/><text x="40.0" y="172.0" font-size="12.5" fill="#1d2633" text-anchor="start" font-weight="bold">B2</text><text x="104.0" y="172.0" font-size="11.5" fill="#1d2633" text-anchor="start" font-weight="normal">none of the fills the journal saw</text><text x="340.0" y="172.0" font-size="12" fill="#1d2633" text-anchor="start" font-weight="normal">closed</text><text x="440.0" y="172.0" font-size="12.5" fill="#9a6200" text-anchor="start" font-weight="bold">suspend</text><text x="560.0" y="172.0" font-size="11.5" fill="#1d2633" text-anchor="start" font-weight="normal">i-105 not found; position -4 unattributed</text><text x="40.0" y="214.0" font-size="13" fill="#1d2633" text-anchor="start" font-weight="bold">Trading windows around the restart</text><text x="40.0" y="260.0" font-size="12" fill="#1d2633" text-anchor="start" font-weight="bold">Miami</text><rect x="160.0" y="249" width="84.0" height="14" fill="#dfe8ee"/><text x="250.0" y="260.0" font-size="10.5" fill="#5f6b7a" text-anchor="start" font-weight="normal">trading ends 23:59 ET, 23:59 local</text><text x="40.0" y="290.0" font-size="12" fill="#1d2633" text-anchor="start" font-weight="bold">Los Angeles</text><rect x="160.0" y="279" width="605.4